<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Pay Slips</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>ABC Company Salary Portal</h1>
    <p class="subtitle">Employee Salary Report</p>

    <div class="top-bar">
      <input type="text" id="search" placeholder="Search by employee name or ID" />
      <button onclick="downloadPage()">Download Report</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>S.No</th>
          <th>Employee ID</th>
          <th>Employee Name</th>
          <th>Basic Pay</th>
          <th>HRA</th>
          <th>Allowance</th>
          <th>Deduction</th>
          <th>Net Pay</th>
        </tr>
      </thead>
      <tbody id="employeeTable"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
